
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Upah Pekerja</title>
</head>
<body>

    <h2>Program Hitung Upah Pekerja</h2>

    <div class="input-group">
        <label for="nama">Nama:</label><br>
        <input type="text" id="nama" placeholder="Masukkan nama Anda">
    </div>
    <br>

    <div class="input-group">
        <label for="jamPekerja">Jam Pekerja:</label><br>
        <input type="number" id="jamPekerja" placeholder="Masukkan jam kerja">
    </div>
    <br>

    <div class="input-group">
        <label for="upahPerJam">Upah Per Jam:</label><br>
        <input type="number" id="upahPerJam" placeholder="Masukkan upah per jam">
    </div>
    <br>

    <div class="btn-group">
        <button id="btnHitung">Hitung Upah</button>
        <button id="reset">Reset</button>
    </div>

    <br>

    <div id="hasil">Hasil:</div>

    <h3>Daftar Pekerja</h3>
    <ul id="daftarBarang"></ul>

    <script src="ukkUpah.js"></script>

</body>
</html>
